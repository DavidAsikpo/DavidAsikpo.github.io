        - icon: fab fa-facebook
          url: https://www.facebook.com/david.asikpo.2025

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/final4.png"
    content: |-
      I build data platforms that analysts and decision-makers can trust. I'm an Analytics Engineer with a background in Statistics, working across Python, SQL, dbt, Snowflake, Databricks, and Airflow.

      At [Datafrik](https://datafrik.co), I teach and build governed data models, automated workflows, and self-service analytics. My work includes cutting CI runtime by 68% through automated testing and deployment, defining 14 governed business metrics backed by 120+ dbt tests, and building a Databricks Lakehouse whose pipeline expectations caught 8 data quality defects.

      I'm also building Production-Ready Data Engineers, an educational platform that teaches data engineering through hands-on projects in orchestration, testing, CI/CD, and cloud infrastructure.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "Python"
        - "SQL"
        - "PySpark"
        - "Dax"
        - "Docker"
        - "Airflow"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: "Datafrik.co"
        companyUrl: "https://www.linkedin.com/company/datafrik-co/"
        jobs:
          - name: "Analytics Engineer"
            date: "Aug 2026 - present"
            content: |
              Contract role building governed Snowflake data models and self-serve metrics for non-technical stakeholders.

              - Consolidated disparate sources into governed domain models on Snowflake using a data mesh approach, with each domain treated as an owned data product.
              - Enforced quality and trust through dbt testing, documentation, and validation standards.
              - Automated pipeline workflows with Python and Airflow, ensuring idempotency, fault tolerance, and reliable scheduled runs.
              - Built a semantic layer with business stakeholders so they can answer questions without writing SQL, and designed Power BI dashboards tracking engagement, operations, and revenue by segment.
            info:
              content: Remote contract role
            featuredItems:
              fontAwesomeIcons:
                - icon: fab fa-github
                  url: https://github.com/DavidAsikpo
                  tooltip: GitHub
                - icon: fa-solid fa-snowflake
                  url: https://www.snowflake.com
                  tooltip: Snowflake
              customIcons:
                - icon: /images/dbt.png
                  url: https://www.getdbt.com
                  tooltip: dbt

      - company: "SMC Academy"
        companyUrl: "https://<smc-academy-website>"
        jobs:
          - name: "Data Analyst & Trainer"
            date: "Aug 2026 - Present"
            info:
              content: Excel analysis and Power BI, DAX and SQL training
            content: |
              I turn raw data into decisions, and teach professionals to do the same.

              - Delivered end-to-end analysis in Excel, taking raw data through to finished insights and reporting.
              - Facilitated and trained professionals in Power BI, DAX, and SQL, building practical skills they use in their own reporting.

      - company: "PRDE"
        companyUrl: "https://www.linkedin.com/in/david-asikpo-luiz"
        jobs:
          - name: "Founder & Instructor"
            date: "Nov 2026 - Present"
            info:
              content: Self-employed
            content: |
              I'm building an education platform that closes the gap between theory and real-world data engineering.

              - Teaching through hands-on projects in Databricks, dbt, Airflow, and Snowflake.
              - Covering the production side that courses often skip: orchestration, testing, CI/CD, and cloud infrastructure.
              - Drawing on my own end-to-end portfolio builds as the teaching material.
            featuredItems:
              fontAwesomeIcons:
                - icon: fab fa-github
                  url: https://github.com/DavidAsikpo
                  tooltip: GitHub
                - icon: fa-solid fa-snowflake
                  url: https://www.snowflake.com
                  tooltip: Snowflake
              customIcons:
                - icon: /images/dbt.png
                  url: https://www.getdbt.com
                  tooltip: dbt
                - icon: /images/databricks.png
                  url: https://www.databricks.com
                  tooltip: Databricks

