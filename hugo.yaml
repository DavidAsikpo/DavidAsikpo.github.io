  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "David Asikpo."
    subtitle: "I Design, Build & Maintain Reliable Data Pipelines."
    content: "I Built a Databricks Lakehouse That Caught 8 Data Quality Defects Before They Reached BI, 5 data sources. 120+ dbt tests. 14 governed metrics. 68% faster CI."
