        school:
          name: "University Of Uyo, Nigeria"
          url: "https://uniuyo.edu.ng/"
        date: "2020 - 2024"
        GPA: "3.1 out of 5.0"
        content: |-
          - Mentored final-year students and guided advanced statistical analysis in linear regression and time series modelling.
          - Built predictive models and documented the methodology, assumptions, and results.
          - Built data pipelines for a university research project that pulled STI case data from remote sources via URIs and prepared it for time series forecasting. [View project](https://github.com/DavidAsikpo/Upper-Respiratory-Tract-Infections-Forecasting.git)
        featuredLink:
          enable: true
          name: "My academic record"
          url: "https://example.com"

  # Achievements
  achievements:
    enable: true
    # title: "Custom Name"
    items:
      - title: Cut CI runtime by 68%
        content: Built CI/CD for the Northwind Threads dbt platform using SQLFluff linting and slim CI, so only changed models are tested on each run.
      - title: Surfaced a 3-day webhook outage
        content: Reconciled Shopify and Stripe revenue to within 0.5%, which exposed a data gap instead of hiding it.
      - title: Caught 8 data-quality defects
        content: Built Delta Live Tables expectations in the Urban Cart lakehouse that flagged every planted defect rather than silently patching it.
      - title: 14 governed business metrics
        content: Defined net revenue, MRR, NRR, CAC, ROAS and LTV:CAC once in a MetricFlow semantic layer, backed by 120+ dbt tests.
      - title: Launching A Production Series For DatA Engineers
        content: Lauched Comprehensive Courses That fast Track the difference between technical skills and ownership of a Data Pipeline.

  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: Northwind Threads, End-to-End Analytics Engineering Platform
        content: A dbt Core and Snowflake platform that unifies 5 sources (Shopify, Stripe, Postgres, Meta/Google Ads, Zendesk) into a Kimball star schema with 14 governed MetricFlow metrics, 120+ dbt tests, and CI/CD that cut CI runtime by 68%. Built on a synthetic DTC apparel dataset.
        image: /images/Northwind_Modern_Analytics_Architecture.png
        featured:
          name: Repository
          link: https://github.com/DavidAsikpo/Northwind_threads_dbt_project.git
        badges:
          - "dbt"
          - "Snowflake"
          - "MetricFlow"
          - "GitHub Actions"
          - "Lightdash"

      - title: Urban Cart, Production-Style Databricks Lakehouse
        content: A portfolio lakehouse that turns raw order data into BI-ready revenue and customer-segmentation tables. Quality rules caught all 8 planted data defects (duplicate orders, a double-discount bug, late returns, inventory drift) instead of silently patching them. PII is masked, BI users are blocked from raw data, and the pipeline runs on a schedule with failure alerts and automated deployment.
        image: /images/demothumb-large-d018-img.jpg
        featured:
          name: Repository
          link: https://github.com/DavidAsikpo/urban_cart_databricks.git
        badges:
          - "Databricks"
          - "PySpark"
          - "Delta Live Tables"
          - "Unity Catalog"
          - "GitHub Actions"

      - title: Hacker News Analytics Pipeline
        content: An end-to-end pipeline that ingests stories from the Hacker News API into S3 and Redshift, transforms them with dbt into tested, documented marts, and orchestrates everything with Airflow and Astronomer Cosmos. Fully containerized with Docker, with dbt tests running in CI on every pull request.
        image: /images/updated_diagram.png
        featured:
          name: Repository
          link: https://github.com/DavidAsikpo/hacker-news-elt-pipeline.git
        badges:
          - "Python"
          - "AWS S3"
          - "Redshift"
          - "dbt"
          - "Airflow"
          - "Docker"

